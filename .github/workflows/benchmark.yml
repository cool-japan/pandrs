name: Benchmark

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype6-dev libfontconfig1-dev

      # Run regression_benchmark in bencher output format for github-action-benchmark
      - name: Run benchmarks
        run: |
          cargo bench --bench regression_benchmark -- --output-format bencher | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PandRS Benchmarks
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Fail CI if any benchmark regresses by more than 10%
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@kitasan'
          # Store baseline on gh-pages branch
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
