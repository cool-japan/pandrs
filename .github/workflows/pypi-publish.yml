name: PyPI Publish

# Builds the pandrs Python extension (py_bindings, maturin backend, abi3) and
# publishes to PyPI when a version tag (v*) is pushed.
#
# Policy: pypi-publish.yml is the only publish workflow permitted in this repo
# (npm-publish.yml would be the JavaScript analogue). No general Rust CI lives here.
#
# Publishing uses PyPI Trusted Publishing (OIDC) via the `pypi` environment — no
# long-lived token is stored. To use an API token instead, drop the `publish` job's
# `id-token: write` permission and swap the final step for `pypa/gh-action-pypi-publish`
# with `password: ${{ secrets.PYPI_API_TOKEN }}`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64 }
          - { runner: ubuntu-latest,  target: aarch64 }
          - { runner: macos-latest,   target: aarch64 }
          - { runner: macos-13,       target: x86_64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto
          working-directory: py_bindings
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: py_bindings/dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: py_bindings
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: py_bindings/dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing (no stored token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
