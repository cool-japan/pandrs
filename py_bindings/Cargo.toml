[package]
name = "pandrs-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for PandRS (Rust implementation of pandas-like DataFrame)"

[lib]
name = "pandrs"
crate-type = ["cdylib"]

[dependencies]
pandrs = { path = "..", default-features = false }
pyo3 = { version = "0.25.0", features = ["abi3-py38", "multiple-pymethods"] }
numpy = "0.25.0"
# pinned to 0.16.1 - numpy 0.25 ABI requires this; root uses 0.17.2 via workspace
ndarray = "0.16.1"

[features]
# Dropped `sql` — py_bindings/src has no SQL code; pandrs has no top-level `sql`
# feature (SQL lives under `distributed` via datafusion). Python test guards with
# hasattr(), so removing the feature doesn't change runtime behavior.
default = ["parquet"]
cuda = ["pandrs/cuda"]
parquet = ["pandrs/parquet"]
distributed = ["pandrs/distributed"]

[lints]
workspace = true
