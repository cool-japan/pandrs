[package]
name = "pandrs"
version = "0.3.1"
edition = "2021"
rust-version = "1.70.0"
description = "A high-performance DataFrame library for Rust, providing pandas-like API with advanced features including SIMD optimization, parallel processing, and distributed computing capabilities"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/pandrs"
homepage = "https://github.com/cool-japan/pandrs"
readme = "README.md"
keywords = ["dataframe", "data", "analytics", "pandas", "statistics"]
categories = ["data-structures", "science", "mathematics"]
#exclude = ["tests/", "benches/", "docs/", "examples/", ".github/"]
exclude = [".github/"]

# Configuration for docs.rs
[package.metadata.docs.rs]
all-features = false
features = ["optimized", "jit", "distributed", "serving", "excel", "visualization", "parquet", "streaming", "backward_compat", "resilience"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
num-traits = "0.2.19"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"  # YAML serialization support
toml = "1.1.2"  # TOML serialization support
thiserror = "2.0.18"
csv = "1.4.0"
rand = "0.10.1"  # Random number generation
chrono-tz = "0.10.4"  # Timezone processing - compatible with chrono 0.4.38
num_cpus = "1.17.0"  # For CPU core detection
# Due to compatibility issues with plotters, using textplots-rs (text-based plots)
textplots = { version = "0.8.7", optional = true }  # For visualization features (text-based)
rayon = "1.12.0"  # For parallel processing
regex = "1.12.3"  # For regular expression processing
lazy_static = "1.5.0"  # For global variables/singletons
url = "2.5.8"  # URL parsing for configuration validation
pbkdf2 = "0.12.2"  # PBKDF2 key derivation for credential security
sha2 = "0.10"  # SHA-2 cryptographic hash functions (must match digest 0.10.x used by pbkdf2/aes-gcm)
aes-gcm = "0.10.3"  # AES-GCM encryption for secure credential storage
async-trait = "0.1.89"  # Async trait support for mock implementations
lru = "0.17.0"  # LRU cache for ReBAC permission caching
# Enable Parquet support with latest version - updated for chrono compatibility
# Pure Rust policy: default-features = false drops the C-backed `zstd` feature.
# `flate2-zlib-rs` selects the Pure Rust zlib-rs backend (NOT miniz_oxide/C).
# Regression: zstd-compressed parquet files are no longer readable on stable/parquet/
# distributed/flight builds. Snappy / gzip / brotli / lz4 remain fully supported.
parquet = { version = "58.1.0", optional = true, default-features = false, features = [
    "arrow",
    "snap",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "base64",
    "simdutf8",
] }  # For Parquet file support (aligned with datafusion 52.x)
# Pure Rust policy: arrow 58.1.0 default = [csv, ipc, json] (no zstd by default).
# We pin the default set explicitly to guard against upstream default drift that
# might add ipc_compression (pulls zstd-sys / lz4-sys C libs).
arrow = { version = "58.1.0", optional = true, default-features = false, features = [
    "csv",
    "ipc",
    "json",
] }  # For Arrow format support (aligned with datafusion 52.x)
plotters = { version = "0.3.7", optional = true }
# For streaming data support
crossbeam-channel = "0.5.15"  # For concurrent message passing
memmap2 = "0.9.10"  # For memory-mapped files
# Excel support (Pure Rust - COOLJAPAN Policy)
oxiarc-archive = { version = "0.2.6", optional = true }  # Pure Rust ZIP for xlsx
quick-xml = { version = "0.39.2", optional = true }  # XML parsing for xlsx

# WebAssembly support (optional)
wasm-bindgen = { version = "0.2.118", optional = true }  # WebAssembly bindings
js-sys = { version = "0.3.95", optional = true }  # JavaScript interop
web-sys = { version = "0.3.95", features = [
    "Document", "Element", "HtmlCanvasElement", "Window",
    "CanvasRenderingContext2d", "MouseEvent", "console"
], optional = true }  # Web API bindings
plotters-canvas = { version = "0.3.1", optional = true }  # Canvas backend for plotters

# CUDA support (optional) - cudarc is platform-specific (see below)
half = { version = "2.7.1", optional = true }  # Half-precision floating point support
ndarray = { version = "0.17.2", optional = true } # N-dimensional arrays

# SciRS2 ecosystem integration
scirs2-core = { version = "0.4.2", optional = true, features = ["validation", "parallel"] }
scirs2-stats = { version = "0.4.2", optional = true }
scirs2-linalg = { version = "0.4.2", optional = true }

# Distributed processing support (optional) - downgraded for chrono compatibility
# Pure Rust policy: default-features = false drops the `compression` feature, which
# pulls C-backed liblzma-sys (xz) + zstd-sys + bzip2 via async-compression. We keep
# all other default features so user-visible DataFusion APIs are unchanged.
datafusion = { version = "53.1.0", optional = true, default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "parquet",
    "recursive_protection",
    "sql",
] }  # DataFrame processing engine
uuid = { version = "1.23.1", features = ["v4", "serde"], optional = true }  # For unique IDs in distributed processing and serving
futures = { version = "0.3.32", optional = true }  # For async operations in distributed processing
tokio = { version = "1.52", features = ["full"], optional = true }  # Async runtime for streaming and resilience
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure", "http"], optional = true }  # Cloud storage backends (S3, GCS, Azure)
bytes = { version = "1.11", optional = true }  # Byte handling for object_store
log = "0.4.29"  # Logging interface

# JIT compilation support (optional)
cranelift = { version = "0.130.1", optional = true }  # JIT compiler
cranelift-module = { version = "0.130.1", optional = true }  # Module system for JIT
cranelift-jit = { version = "0.130.1", optional = true }  # JIT compilation backend
cranelift-frontend = { version = "0.130.1", optional = true }  # Frontend for building IR
cranelift-native = { version = "0.130.1", optional = true }  # Native target detection
target-lexicon = { version = "0.13.5", optional = true }  # Target specification
arrow-flight = { version = "58.1.0", optional = true }
tonic = { version = "0.14", optional = true }   # gRPC runtime for Arrow Flight
prost = { version = "0.14", optional = true }   # protobuf serialization for Arrow Flight

[workspace.lints.rust]
unused_variables = "allow"
unused_imports = "allow"
mismatched_lifetime_syntaxes = "allow"
dead_code = "allow"
unpredictable_function_pointer_comparisons = "allow"
unknown_lints = "allow"

[features]
default = []
optimized = []  # Flag for optimized implementation
jit = ["cranelift", "cranelift-module", "cranelift-jit", "cranelift-frontend", "cranelift-native", "target-lexicon"]  # Just-In-Time compilation support
backward_compat = []  # Backward compatibility for older APIs
wasm = ["wasm-bindgen", "js-sys", "web-sys", "plotters-canvas", "visualization"]  # WebAssembly support
cuda = ["cudarc", "half", "dep:ndarray"]  # CUDA support (requires CUDA toolkit)
scirs2 = ["dep:scirs2-core", "dep:scirs2-stats", "dep:scirs2-linalg", "dep:ndarray"]  # SciRS2 scientific computing integration
# Pure Rust policy note: pulls async-compression -> bzip2/brotli and arrow/parquet -> flate2/zstd/lz4_flex/snap transitively (upstream, feature-gated).
distributed = ["datafusion", "uuid", "dep:arrow", "dep:parquet", "dep:futures"]  # Distributed processing support
# Pure Rust policy note: pulls async-compression -> bzip2/brotli transitively (upstream, feature-gated).
serving = ["uuid", "dep:tokio", "dep:futures"]  # Model serving and deployment support
excel = ["dep:oxiarc-archive", "dep:quick-xml"]  # Excel support (Pure Rust xlsx via OxiARC)
visualization = ["textplots", "plotters"]  # Visualization support
# Pure Rust policy note: arrow/parquet transitively pull flate2/zstd/lz4_flex/snap (upstream, feature-gated).
parquet = ["dep:arrow", "dep:parquet"]  # Parquet file support
streaming = ["dep:tokio", "dep:futures"]  # Streaming data processing support
# Pure Rust policy note: object_store 0.13.2 pulls `ring` (C+asm) directly; upstream blocker documented in /tmp/pandrs_rustls_phase2_report.md.
cloud-storage = ["dep:object_store", "dep:bytes", "dep:tokio", "dep:futures"]  # Cloud-native storage backends (S3, GCS, Azure Blob)

# Feature bundle for testing core features without external dependencies
test-core = ["optimized", "backward_compat", "streaming"]

# Feature bundle for testing most features without CUDA/WASM (visualization has compilation issues)
test-safe = ["optimized", "parquet", "excel", "streaming", "backward_compat"]

# Feature bundle for all safe features (excludes CUDA/WASM/distributed which require external tools)
all-safe = ["optimized", "serving", "parquet", "excel", "streaming", "backward_compat", "resilience", "cloud-storage"]

# Feature bundle that works reliably for CI/development (most stable features)
stable = ["optimized", "parquet", "excel", "streaming", "backward_compat", "cloud-storage"]

# Resilience patterns (retry mechanisms, circuit breakers)
resilience = ["dep:tokio"]
# Arrow Flight RPC for distributed data transfer
# Pure Rust policy note: inherits distributed's transitives (flate2/zstd/lz4_flex/snap/bzip2/brotli) via arrow-flight/tonic (upstream, feature-gated).
flight = ["dep:arrow-flight", "dep:tonic", "dep:prost", "dep:arrow", "dep:tokio", "dep:futures", "dep:bytes", "distributed"]

[dependencies.tempfile]
version = "3.27.0"  # Create temporary files and directories

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1.52", features = ["full"] }  # Async runtime for integration tests

[[bench]]
name = "comprehensive_benchmark"
harness = false

[[bench]]
name = "enhanced_comprehensive_benchmark"
harness = false

[[bench]]
name = "regression_benchmark"
harness = false

[[bench]]
name = "profiling_benchmark"
harness = false

[[bench]]
name = "legacy_dataframe_bench"
harness = false

[[bench]]
name = "pandas_comparison_benchmark"
harness = false

[[bench]]
name = "ml_benchmarks"
harness = false

[[bench]]
name = "query_optimizer_benchmarks"
harness = false

[[bench]]
name = "multitenancy_benchmarks"
harness = false

[[bench]]
name = "simd_string_benchmarks"
harness = false

[[bench]]
name = "comprehensive_features_benchmark"
harness = false

[[bench]]
name = "comparison_benchmark"
harness = false

[lints]
workspace = true

# Platform-specific dependencies: CUDA only on non-macOS (macOS doesn't support CUDA)
[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { version = "0.19.4", optional = true, features = ["driver", "cublas", "cuda-version-from-build-system"] }
